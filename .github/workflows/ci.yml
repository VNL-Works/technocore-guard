name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Preflight
        run: python scripts/preflight.py

      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Security lint
        run: python scripts/security_lint.py

      - name: Release manifest reproducibility
        run: python scripts/build_release_manifest.py --check-only

      - name: Git whitespace check
        run: git diff --check HEAD
